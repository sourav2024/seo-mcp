name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    # The engines floor (20.10) plus every current LTS line, and macOS for the
    # platform-specific paths (state dir, Chrome detection).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["20.10", 22, 24]
        include:
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Package contents
        run: npm pack --dry-run
